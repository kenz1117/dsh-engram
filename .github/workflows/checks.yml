name: checks

# The two gates from the README's "Checks before a PR" that a bare runner can
# run, plus a lockfile check.
#
# `typecheck`, `test` and `bundle` are deliberately absent. `.npmrc` records the
# reason: the `@deepseek-ai/*` peers are not installable from npm (the chain
# there is incomplete, and harness internals use the `workspace:^` protocol), so
# `scripts/link-peers.mjs` takes them from a sibling `deepseek-harness`
# workspace. A hosted runner has no such workspace, and `src/index.ts`,
# `src/config.ts`, `src/llm/client.ts` and `src/tools/create.ts` import *values*
# from those peers — tsc, vitest and tsdown all fail to resolve them there.
#
# The gates below touch no peer at all: the first reads `src/` as text, the
# second imports three peer-free modules.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm 版本单一来源 = package.json 的 packageManager 字段（这里的 version:
      # 与它并存会让 pnpm/action-setup 直接报 Multiple versions 错误——0.9.0 后实测踩坑）。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # --ignore-scripts: `prepare` runs scripts/ensure-build.mjs, which builds
      # both bundles — and building needs the peers.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # biome 自带 TS/TSX 解析器（不依赖 tsc 的 JS API——typescript-eslint 截至最新版
      # 只支持 TS <6.1，本仓用 TS 7），不需要 peers，hosted runner 可跑。
      # 现存 34 条 warn 是已入册的 a11y/依赖数组债（audit-2026-10-27 §2/§5），
      # biome 对 error 级退出非零——增量代码回退会在这里响。
      - name: lint (biome)
        run: pnpm lint
      - name: message dictionary parity
        run: node scripts/check-messages.mjs
      - name: language pattern acceptance
        run: node scripts/check-patterns.mjs
      # Packaging smoke (audit 2026-10-18 §7): 0.8.0–0.8.14 shipped a tarball a
      # clean profile could not install (peers not optional — PR #23). Two cheap
      # guards that run without the peers:
      #  1. the published metadata must keep every @deepseek-ai/* peer optional;
      #  2. the dependency tree of the packed tarball must resolve from the
      #     registry (--dry-run: metadata only, no model downloads).
      # lib/ itself cannot be built here (see the header comment) — tarball
      # contents are verified locally by scripts/ensure-build.mjs at publish.
      - name: packaging smoke
        run: |
          node -e "
            const pkg = require('./package.json');
            const peers = Object.keys(pkg.peerDependencies ?? {});
            const meta = pkg.peerDependenciesMeta ?? {};
            const notOptional = peers.filter(p => meta[p]?.optional !== true);
            if (peers.length === 0) throw new Error('no peerDependencies declared');
            if (notOptional.length > 0) throw new Error('peers not optional: ' + notOptional.join(', '));
            console.log('peers optional:', peers.join(', '));
          "
          npm pack --ignore-scripts
          mkdir smoketest && cd smoketest && npm init -y
          npm install --dry-run --ignore-scripts "$(find .. -name 'kenz1117-dsh-engram-*.tgz' | head -1)"
