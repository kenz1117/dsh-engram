<!doctype html>
<!--
  GitHub 社交预览图（1280×640）的生成源。GitHub 不会自动生成这张图，
  需在仓库 Settings → General → Social preview 上传同尺寸图片。
  重新生成：
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --screenshot=docs/store/social-preview.png --window-size=1280,640 \
      file://$PWD/docs/store/social-preview.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background:
      radial-gradient(900px 520px at 18% 12%, rgba(212,160,23,0.18), transparent 62%),
      radial-gradient(760px 480px at 88% 88%, rgba(107,150,255,0.14), transparent 60%),
      linear-gradient(160deg, #12161f 0%, #171c27 52%, #10131a 100%);
    color: #e9edf5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 92px; box-sizing: border-box; position: relative;
  }
  .mark { position: absolute; right: 92px; top: 50%; transform: translateY(-50%); width: 300px; height: 300px; color: #e8a33c; opacity: 0.92; }
  .eyebrow { font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: #d4a017; margin: 0 0 22px; font-weight: 600; }
  h1 { font-size: 56px; line-height: 1.14; margin: 0 0 22px; font-weight: 700; letter-spacing: -0.02em; max-width: 790px; }
  h1 .accent { color: #e8a33c; }
  .sub { font-size: 27px; line-height: 1.45; margin: 0 0 36px; color: #aeb7c7; max-width: 780px; }
  .chips { display: flex; gap: 14px; flex-wrap: wrap; }
  .chip { font-size: 22px; padding: 11px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05); color: #d7dde8; }
  .chip b { color: #e8a33c; font-weight: 600; }
</style>
</head>
<body>
  <p class="eyebrow">DeepSeek Harness Plugin</p>
  <h1>Local-first long-term memory.<br><span class="accent">For your coding agent.</span></h1>
  <p class="sub">Zero setup. Zero API keys. Zero Docker. A SQLite memory palace with hybrid retrieval, an evidence gate and spaced-repetition review.</p>
  <div class="chips">
    <span class="chip"><b>22</b> narrow tools</span>
    <span class="chip">FTS5 + local vectors</span>
    <span class="chip">Evidence gate</span>
    <span class="chip">zh / en / ru</span>
  </div>

  <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
    <defs>
      <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="currentColor" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="currentColor" stop-opacity="0.55"/>
      </linearGradient>
    </defs>
    <rect x="5" y="38" width="38" height="3" rx="1.5" fill="currentColor" opacity="0.25"/>
    <path d="M6 20 L24 7 L42 20 Z" fill="url(#roof)"/>
    <rect x="9" y="20" width="30" height="18" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="9" y1="20" x2="39" y2="20" stroke="currentColor" stroke-width="2"/>
    <rect x="13" y="24" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <line x1="16" y1="24" x2="16" y2="30" stroke="currentColor" stroke-width="1.2"/>
    <line x1="13" y1="27" x2="19" y2="27" stroke="currentColor" stroke-width="1.2"/>
    <path d="M21 38 L21 28 Q21 25 24 25 Q27 25 27 28 L27 38" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <rect x="29" y="24" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <line x1="32" y1="24" x2="32" y2="30" stroke="currentColor" stroke-width="1.2"/>
    <line x1="29" y1="27" x2="35" y2="27" stroke="currentColor" stroke-width="1.2"/>
    <line x1="20" y1="40.5" x2="28" y2="40.5" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
  </svg>
</body>
</html>
