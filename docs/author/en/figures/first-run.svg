<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" role="img">
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
<marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker>
</defs>
<rect width="1000" height="700" fill="#ffffff"/>
<text x="40" y="42" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">First run: how the palace picks the language</text>
<text x="40" y="68" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13" fill="#475569">One fork at the start, three outcomes. The window asks only where nothing can decide</text>
<rect x="340" y="104" width="320" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="500" y="128" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#312e81" text-anchor="middle">is config.language set?</text>
<text x="500" y="145" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">concrete language code</text>
<text x="352" y="96" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="start">no — we decide it</text>
<path d="M 500 160 L 500 186" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="340" y="186" width="320" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="500" y="213" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Read the person's speech</text>
<text x="500" y="230" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">current session only; logs are not read</text>
<path d="M 500 248 L 500 274" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="340" y="274" width="320" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="500" y="302" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#312e81" text-anchor="middle">Dialogue language determined?</text>
<text x="500" y="319" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">min 40 letters, share ≥ 0.6</text>
<path d="M 340 306 L 200 306 L 200 372" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<text x="208" y="298" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start">yes, bases match</text>
<path d="M 500 338 L 500 372" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<text x="508" y="360" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start">no utterances</text>
<path d="M 660 306 L 800 306 L 800 372" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<text x="700" y="298" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start">bases in other language</text>
<rect x="40" y="372" width="300" height="190" rx="14" fill="#fbfbfe" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="400" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">AUTO — palace decides</text>
<rect x="60" y="404" width="258" height="66" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="189" y="433" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#065f46" text-anchor="middle">Writes the dialogue language to config</text>
<text x="189" y="450" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#047857" text-anchor="middle">only backed by the person's voice</text>
<rect x="60" y="484" width="258" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="189" y="501.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Panel reports what it chose</text>
<text x="189" y="518.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">settled</text>
<text x="189" y="535.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">“applies after restart”</text>
<rect x="340" y="372" width="320" height="250" rx="14" fill="#fbfbfe" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="360" y="400" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">QUESTION — no basis</text>
<rect x="360" y="404" width="280" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500" y="428.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">Window at panel root</text>
<text x="500" y="445.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">ZH / EN / RU / Other language; default</text>
<text x="500" y="460.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">— Windows locale</text>
<rect x="360" y="490" width="280" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="500" y="517" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Choice written as language code</text>
<text x="500" y="534" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">ZH, EN, RU — as is; “other language” —</text>
<text x="500" y="549" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">the real locale code (fr), not an</text>
<text x="500" y="564" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">English substitute</text>
<rect x="680" y="372" width="280" height="250" rx="14" fill="#fbfbfe" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="700" y="400" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">MISMATCH</text>
<rect x="700" y="404" width="240" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="820" y="436" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">Window: dialogues X, bases Y</text>
<text x="820" y="453" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">default — the dialogue language</text>
<rect x="700" y="490" width="240" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="820" y="524.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Same picker window</text>
<text x="820" y="541.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">one installation cannot live in</text>
<text x="820" y="556.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">two languages</text>
<path d="M 200 562 L 200 640 L 500 640" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M 500 582 L 500 640" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M 820 622 L 820 640 L 500 640" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="340" y="640" width="320" height="46" rx="10" fill="#4338ca" stroke="#4338ca" stroke-width="2"/>
<text x="500" y="666.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#ffffff" text-anchor="middle">Plugin restart — language takes effect</text>
<text x="40" y="690" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#991b1b" text-anchor="start">At no step are records or vectors converted: the language is a switch, not a conversion</text>
</svg>