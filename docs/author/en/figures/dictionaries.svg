<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" role="img">
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
<marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker>
</defs>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="40" y="42" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Dictionaries: what stays in code, what comes as a file</text>
<text x="40" y="68" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13" fill="#475569">English and Chinese are built-in sets. Russian and any next language are a file, with no TypeScript edits</text>
<rect x="40" y="92" width="440" height="236" rx="14" fill="#fbfbfe" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="120" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">IN THE BUILD (shipped, code)</text>
<rect x="60" y="124" width="400" height="58" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="260" y="141.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c1d95" text-anchor="middle">src/i18n/catalog/*.ts — server messages</text>
<text x="260" y="158.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#6d28d9" text-anchor="middle">en — completeness reference and source of keys, zh — the author's</text>
<text x="260" y="173.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#6d28d9" text-anchor="middle">wording</text>
<rect x="60" y="194" width="400" height="58" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="260" y="211.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c1d95" text-anchor="middle">src/client/locales/*.ts — panel texts</text>
<text x="260" y="228.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#6d28d9" text-anchor="middle">en, zh, ru: interface labels, switched together with the language</text>
<text x="260" y="243.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#6d28d9" text-anchor="middle">DSH</text>
<rect x="60" y="264" width="400" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="260" y="285" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">An edit here requires a rebuild and a release</text>
<text x="260" y="302" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">so everything that must be edited without one lives as a file</text>
<rect x="520" y="92" width="440" height="236" rx="14" fill="#fbfbfe" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="540" y="120" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">AS A FILE (data, dbDir)</text>
<rect x="540" y="124" width="400" height="58" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="740" y="149" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#065f46" text-anchor="middle">i18n/ru.txt — 485 texts</text>
<text x="740" y="166" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#047857" text-anchor="middle">the shipped translation of server messages</text>
<rect x="540" y="194" width="400" height="58" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="740" y="219" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#065f46" text-anchor="middle">&lt;dbDir&gt;/i18n/ru.txt — the user layer</text>
<text x="740" y="236" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#047857" text-anchor="middle">outranks the shipped default; survives reinstall</text>
<rect x="540" y="264" width="400" height="50" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="740" y="285" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#065f46" text-anchor="middle">&lt;dbDir&gt;/i18n/panel.ru.txt</text>
<text x="740" y="302" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#047857" text-anchor="middle">same for the panel: different file, same format</text>
<path d="M 260 328 L 260 360" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M 740 328 L 740 360" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="140" y="360" width="240" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="260" y="383" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Server half</text>
<text x="260" y="400" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">message(language, key)</text>
<rect x="620" y="360" width="240" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="740" y="383" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Panel</text>
<text x="740" y="400" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">t(key)</text>
<rect x="140" y="444" width="720" height="66" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="500" y="473" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#312e81" text-anchor="middle">Fallback order: file dictionary → built-in set → English text</text>
<text x="500" y="490" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">no file — the texts are not empty: the English string remains, so a language can be added even before translation</text>
<rect x="140" y="530" width="720" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="500" y="557" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">A new language is added by data, not by code</text>
<text x="500" y="574" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">the file &lt;dbDir&gt;/i18n/fr.txt + lines in registry/bindings.json; the panel learns about it from registry/languages.json</text>
</svg>