<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" role="img">
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
<marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker>
</defs>
<rect width="1000" height="480" fill="#ffffff"/>
<text x="40" y="42" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">语言的两条轴：界面与宫殿</text>
<text x="40" y="68" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13" fill="#475569">这是两件不同的事，不能混：一条只改文字，另一条改记忆的行为</text>
<rect x="40" y="92" width="920" height="150" rx="14" fill="#fbfbfe" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="120" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">界面轴 · 自由切换</text>
<rect x="60" y="124" width="260" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="190" y="162.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">面板语言</text>
<text x="190" y="179.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">自动或手动；跟随语言</text>
<text x="190" y="194.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">DSH</text>
<rect x="360" y="124" width="260" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490" y="162.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">标签词典</text>
<text x="490" y="179.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">zh / en / ru 在代码里，其余——</text>
<text x="490" y="194.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">用文件</text>
<rect x="660" y="124" width="280" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="800" y="170" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#065f46" text-anchor="middle">只改文字</text>
<text x="800" y="187" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#047857" text-anchor="middle">模型、标记、记忆都不变</text>
<path d="M 320 174 L 358 174" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M 620 174 L 658 174" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="40" y="258" width="920" height="160" rx="14" fill="#fbfbfe" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="286" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">宫殿轴 · 由宫殿掌管的开关</text>
<rect x="60" y="292" width="260" height="108" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="190" y="334.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#312e81" text-anchor="middle">config.language</text>
<text x="190" y="351.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">半自动：依据对话或</text>
<text x="190" y="366.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">窗口里的回答</text>
<rect x="360" y="292" width="260" height="108" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490" y="334.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">它掌管什么</text>
<text x="490" y="351.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">模型、指令、新记忆的</text>
<text x="490" y="366.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">语言、库的标记</text>
<rect x="660" y="292" width="280" height="108" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="800" y="334.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#312e81" text-anchor="middle">改变宫殿行为</text>
<text x="800" y="351.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">因此换语言要配合</text>
<text x="800" y="366.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">库的重算</text>
<path d="M 320 346 L 358 346" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M 620 346 L 658 346" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M 120 224 L 120 290" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwA)"/>
<text x="128" y="262" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="600">不受影响</text>
<text x="40" y="452" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="start">因此，选择界面语言只是「看看」，并不会翻译宫殿；而更换宫殿语言也不动已经写下的东西——改变的是宫殿此后用什么来写。</text>
</svg>