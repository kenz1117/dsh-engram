<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" role="img">
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
<marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker>
</defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="40" y="42" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">宫殿语言切换：一个拼齐的条件，不是三个独立按钮</text>
<text x="40" y="68" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13" fill="#475569">条件未完全拼齐前，不向配置写入任何内容</text>
<rect x="40" y="120" width="300" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="190" y="151" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">1. 已选择另一个宫殿语言</text>
<text x="190" y="168" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">人，不是自动机制</text>
<rect x="40" y="214" width="300" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="190" y="245" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">2. 联锁保险已解除</text>
<text x="190" y="262" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">同一表单中的复选框</text>
<rect x="40" y="308" width="300" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="190" y="339" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">3. 已点击「执行」</text>
<text x="190" y="356" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">只有它才发送请求</text>
<path d="M 340 155 L 400 240" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M 340 249 L 400 249" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M 340 343 L 400 258" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="400" y="196" width="220" height="106" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="510" y="237.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#312e81" text-anchor="middle">与：三个条件全部</text>
<text x="510" y="254.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">以一个请求发往服务器</text>
<text x="510" y="269.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">并一起校验</text>
<path d="M 620 249 L 676 249" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="676" y="196" width="300" height="106" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="826" y="237.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#065f46" text-anchor="middle">库重算已启动</text>
<text x="826" y="254.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#047857" text-anchor="middle">语言切换与向量转换是一件事</text>
<text x="826" y="269.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#047857" text-anchor="middle">一个动作，不是两个相邻动作</text>
<rect x="40" y="420" width="936" height="58" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
<text x="508" y="445" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#991b1b" text-anchor="middle">30 秒窗口是设置 palaceChangeWindowSec，不是常量</text>
<text x="508" y="462" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="middle">计时从三个事件中的第一个开始，且存在于表单本身：这是人的同意，不是后台任务</text>
<rect x="40" y="490" width="936" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="508" y="512" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">窗口过期——选择回落到库当前所用的语言，联锁保险自动复位</text>
<text x="508" y="529" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">无需回退：点击「执行」之前什么都没写入，表单只是忘掉未拼齐的选择</text>
</svg>