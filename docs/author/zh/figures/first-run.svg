<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" role="img">
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
<marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker>
</defs>
<rect width="1000" height="700" fill="#ffffff"/>
<text x="40" y="42" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">首次启动：宫殿如何选语言</text>
<text x="40" y="68" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13" fill="#475569">开头一个分叉，三种结果。只有在无从判断时才弹窗询问</text>
<rect x="340" y="104" width="320" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="500" y="128" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#312e81" text-anchor="middle">config.language 已设置？</text>
<text x="500" y="145" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">具体语言代码</text>
<text x="352" y="96" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="start">否——自行判断</text>
<path d="M 500 160 L 500 186" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="340" y="186" width="320" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="500" y="213" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">读取人的发言</text>
<text x="500" y="230" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">仅当前会话；不读日志</text>
<path d="M 500 248 L 500 274" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="340" y="274" width="320" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="500" y="302" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#312e81" text-anchor="middle">对话语言已确定？</text>
<text x="500" y="319" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#4f46e5" text-anchor="middle">不少于 40 个字母，占比 ≥ 0,6</text>
<path d="M 340 306 L 200 306 L 200 372" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<text x="208" y="298" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start">是，库一致</text>
<path d="M 500 338 L 500 372" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<text x="508" y="360" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start">没有发言</text>
<path d="M 660 306 L 800 306 L 800 372" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<text x="700" y="298" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start">库为另一种语言</text>
<rect x="40" y="372" width="300" height="190" rx="14" fill="#fbfbfe" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="400" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">自动——宫殿自行决定</text>
<rect x="60" y="404" width="258" height="66" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="189" y="433" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#065f46" text-anchor="middle">将对话语言写入配置</text>
<text x="189" y="450" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#047857" text-anchor="middle">仅在有人的发言为依据时</text>
<rect x="60" y="484" width="258" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="189" y="501.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">面板提示依据</text>
<text x="189" y="518.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">已设定</text>
<text x="189" y="535.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">「重启后生效」</text>
<rect x="340" y="372" width="320" height="250" rx="14" fill="#fbfbfe" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="360" y="400" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">询问——没有依据</text>
<rect x="360" y="404" width="280" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500" y="428.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">面板根部的窗口</text>
<text x="500" y="445.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">ZH / EN / RU / 其他语言；预置值</text>
<text x="500" y="460.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">——Windows 区域设置</text>
<rect x="360" y="490" width="280" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="500" y="517" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">所选以语言代码写入</text>
<text x="500" y="534" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">ZH、EN、RU 原样；「其他语言」——</text>
<text x="500" y="549" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">真实的区域代码（fr），而不是</text>
<text x="500" y="564" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">英语替代品</text>
<rect x="680" y="372" width="280" height="250" rx="14" fill="#fbfbfe" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="700" y="400" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">不一致</text>
<rect x="700" y="404" width="240" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="820" y="436" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">窗口：对话为 X，库为 Y</text>
<text x="820" y="453" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">预置值——对话语言</text>
<rect x="700" y="490" width="240" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="820" y="524.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">同一个选择窗口</text>
<text x="820" y="541.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">一次安装不能同时使用</text>
<text x="820" y="556.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">两种语言</text>
<path d="M 200 562 L 200 640 L 500 640" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M 500 582 L 500 640" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<path d="M 820 622 L 820 640 L 500 640" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
<rect x="340" y="640" width="320" height="46" rx="10" fill="#4338ca" stroke="#4338ca" stroke-width="2"/>
<text x="500" y="666.5" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#ffffff" text-anchor="middle">重启插件——语言生效</text>
<text x="40" y="690" font-family="'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="11.5" fill="#991b1b" text-anchor="start">在任何一步都不会转换记忆和向量：语言是开关，不是转换</text>
</svg>